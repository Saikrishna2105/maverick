<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dual Captions</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px 16px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 8px; }
    .row > label:first-child { flex: 1; }
    select { width: 130px; padding: 3px; }
    input[type="range"] { width: 130px; }
    .langs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; }
    .langs label { display: block; font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
    .langs select { width: 100%; }
    .arrow { padding-bottom: 4px; }
    hr { border: none; border-top: 1px solid rgba(128, 128, 128, 0.3); margin: 12px 0; }
    #status { font-size: 12px; opacity: 0.85; min-height: 1.4em; }
    #model-status { font-size: 12px; opacity: 0.7; }
    button { margin-top: 6px; padding: 4px 10px; cursor: pointer; }
    .hint { font-size: 11px; opacity: 0.6; margin-top: 10px; }

    /* Simple toggle switch */
    .switch { position: relative; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #9e9e9e; border-radius: 20px; transition: background 0.15s;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: transform 0.15s;
    }
    .switch input:checked + .slider { background: #4caf50; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 2px solid #2196f3; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Dual Captions</h1>

  <div class="row">
    <label for="enabled"><strong>Show translations</strong></label>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>

  <div class="langs">
    <div>
      <label for="sourceLang">Captions in</label>
      <select id="sourceLang"></select>
    </div>
    <span class="arrow">→</span>
    <div>
      <label for="targetLang">Translate to</label>
      <select id="targetLang"></select>
    </div>
  </div>

  <div class="row">
    <label for="fontSize">Font size: <span id="fontSizeValue"></span>px</label>
    <input type="range" id="fontSize" min="12" max="48" step="1">
  </div>

  <div class="row">
    <label for="debug">Debug mode <small>(logs to the page console)</small></label>
    <label class="switch"><input type="checkbox" id="debug"><span class="slider"></span></label>
  </div>

  <hr>

  <div id="status">Checking on-device translator…</div>
  <button id="download" hidden>Download on-device model</button>
  <div id="model-status"></div>

  <p class="hint">Reload the video page after installing or updating the extension.</p>

  <script src="popup.js"></script>
</body>
</html>
